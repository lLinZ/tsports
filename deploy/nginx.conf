# =====================================================================
#  TS SPORTS — Configuración de nginx para el VPS
#  ---------------------------------------------------------------------
#  Un solo dominio sirve las dos mitades del sistema:
#
#    ·  /            → el build de React (ficheros estáticos)
#    ·  /api/…       → la API de Laravel (PHP-FPM)
#    ·  /storage/…   → las imágenes subidas
#
#  Que todo salga por el mismo origen tiene dos ventajas: no hace falta
#  CORS y el token de sesión nunca viaja entre dominios distintos.
#
#  INSTALACIÓN
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/tsports
#    sudo ln -s /etc/nginx/sites-available/tsports /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Después, el certificado HTTPS (gratis, se renueva solo):
#    sudo certbot --nginx -d tssports.com -d www.tssports.com
#
#  SUSTITUYE ANTES:
#    · tssports.com          → tu dominio real
#    · /var/www/tsports      → la ruta donde clonaste el repositorio
#    · php8.2-fpm.sock       → la versión de PHP instalada en el VPS
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name tssports.com www.tssports.com;

    # El build de React. Laravel vive aparte, en backend/public.
    root /var/www/tsports/frontend/dist;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------
    # Seguridad básica
    # ---------------------------------------------------------------
    # Que no se anuncie la versión de nginx en las cabeceras.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de subida. Tiene que ser algo mayor que el límite de
    # 5 MB por imagen del backend, porque la petición lleva además las
    # cabeceras y los bordes del formulario.
    client_max_body_size 12M;

    # ---------------------------------------------------------------
    # 1) La API de Laravel
    # ---------------------------------------------------------------
    location /api {
        # Se reescribe hacia el index.php de Laravel, que resuelve la ruta.
        try_files $uri $uri/ /index.php?$query_string;

        root /var/www/tsports/backend/public;

        location ~ ^/api {
            include fastcgi_params;

            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/tsports/backend/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/tsports/backend/public;

            # Laravel necesita saber que el visitante llegó por HTTPS o
            # generaría URLs con http:// y el navegador bloquearía las
            # imágenes por contenido mixto.
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param REQUEST_SCHEME $scheme;

            # Una subida grande o un informe pesado pueden tardar.
            fastcgi_read_timeout 120;
        }
    }

    # Comprobación de salud del backend, para el monitor del VPS.
    location = /up {
        root /var/www/tsports/backend/public;

        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/tsports/backend/public/index.php;
    }

    # ---------------------------------------------------------------
    # 2) Las imágenes subidas
    # ---------------------------------------------------------------
    # Apuntan al enlace simbólico que crea `php artisan storage:link`.
    location /storage {
        alias /var/www/tsports/backend/storage/app/public;

        # Los ficheros llevan nombre aleatorio y nunca cambian de
        # contenido, así que se pueden cachear indefinidamente.
        expires 1y;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # 3) El frontend (React)
    # ---------------------------------------------------------------
    # Los ficheros del build llevan un hash en el nombre: cuando cambia
    # el contenido cambia el nombre, así que se cachean para siempre.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # Cualquier otra dirección devuelve el index.html y es React quien
    # resuelve la ruta. Sin esto, recargar en /marcas daría un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html NO se cachea: es el que apunta a los assets nuevos
    # después de cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------
    # Compresión
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------
    # Ficheros que nunca se sirven
    # ---------------------------------------------------------------
    # Ni los ocultos (.env, .git) ni nada que quede fuera de sitio.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Registros separados por sitio, para poder leerlos.
    access_log /var/log/nginx/tsports-access.log;
    error_log  /var/log/nginx/tsports-error.log;
}
