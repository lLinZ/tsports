# =====================================================================
#  TS SPORTS — Configuración de nginx para el VPS
#  ---------------------------------------------------------------------
#  Un solo dominio sirve las dos mitades del sistema:
#
#    ·  /            → el build de React (ficheros estáticos)
#    ·  /api/…       → la API de Laravel (PHP-FPM)
#    ·  /app/…       → el WebSocket de Reverb (tiempo real)
#    ·  /storage/…   → las imágenes subidas
#    ·  /sw.js       → el service worker de la aplicación instalable
#
#  Que todo salga por el mismo origen tiene dos ventajas: no hace falta
#  CORS y el token de sesión nunca viaja entre dominios distintos.
#
#  INSTALACIÓN
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/tsports
#    sudo ln -s /etc/nginx/sites-available/tsports /etc/nginx/sites-enabled/
#    sudo cp deploy/nginx-seguridad.conf /etc/nginx/snippets/tsports-seguridad.conf
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Después, el certificado HTTPS (gratis, se renueva solo):
#    sudo certbot --nginx -d tssports.com -d www.tssports.com
#
#  SUSTITUYE ANTES:
#    · tssports.com          → tu dominio real
#    · /var/www/tsports      → la ruta donde clonaste el repositorio
#    · php8.2-fpm.sock       → la versión de PHP instalada en el VPS
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name tssports.com www.tssports.com;

    # El build de React. Laravel vive aparte, en backend/public.
    root /var/www/tsports/frontend/dist;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------
    # Seguridad básica
    # ---------------------------------------------------------------
    # Que no se anuncie la versión de nginx en las cabeceras.
    server_tokens off;

    # Las cabeceras de seguridad, en un fichero aparte que se incluye
    # aquí y otra vez en cada location que pone cabeceras propias: en
    # nginx, un add_header dentro de un location anula todos los de
    # arriba. Ver deploy/nginx-seguridad.conf.
    include snippets/tsports-seguridad.conf;

    # Tamaño máximo de una petición. Va a la par con los 20 MB por fichero
    # de Laravel (GuardadoDeArchivos) y con el post_max_size de PHP
    # (deploy/php-tsports.ini): la petición lleva además la miniatura y
    # los bordes del formulario. Si solo se sube uno de los tres, nginx o
    # PHP cortan la subida sin que Laravel llegue a verla.
    client_max_body_size 25M;

    # ---------------------------------------------------------------
    # 1) La API de Laravel
    # ---------------------------------------------------------------
    location /api {
        # Se reescribe hacia el index.php de Laravel, que resuelve la ruta.
        try_files $uri $uri/ /index.php?$query_string;

        root /var/www/tsports/backend/public;

        location ~ ^/api {
            include fastcgi_params;

            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/tsports/backend/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/tsports/backend/public;

            # Laravel necesita saber que el visitante llegó por HTTPS o
            # generaría URLs con http:// y el navegador bloquearía las
            # imágenes por contenido mixto.
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param REQUEST_SCHEME $scheme;

            # Una subida grande o un informe pesado pueden tardar.
            fastcgi_read_timeout 120;
        }
    }

    # Comprobación de salud del backend, para el monitor del VPS.
    location = /up {
        root /var/www/tsports/backend/public;

        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/tsports/backend/public/index.php;
    }

    # ---------------------------------------------------------------
    # 1b) Tiempo real (Reverb)
    # ---------------------------------------------------------------
    # `artisan reverb:start` solo escucha en 127.0.0.1:8080 (ver
    # REVERB_SERVER_HOST/PORT en backend/.env.example): nadie de fuera
    # llega ahí directo. El navegador abre el WebSocket contra este mismo
    # dominio y puerto 443, y nginx lo reenvía dentro de la máquina — así
    # no hace falta abrir ningún puerto nuevo en el cortafuegos, que hoy
    # solo tiene SSH, HTTP y HTTPS.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Una conexión de WebSocket se queda abierta minutos, no
        # segundos: el tiempo de espera por defecto la cortaría sola.
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # 2) Las imágenes subidas
    # ---------------------------------------------------------------
    # Apuntan al enlace simbólico que crea `php artisan storage:link`.
    location /storage {
        alias /var/www/tsports/backend/storage/app/public;

        # Los ficheros llevan nombre aleatorio y nunca cambian de
        # contenido, así que se pueden cachear indefinidamente.
        expires 1y;
        include snippets/tsports-seguridad.conf;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # 3) El frontend (React)
    # ---------------------------------------------------------------
    # Los ficheros del build llevan un hash en el nombre: cuando cambia
    # el contenido cambia el nombre, así que se cachean para siempre.
    location /assets {
        expires 1y;
        include snippets/tsports-seguridad.conf;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # Cualquier otra dirección devuelve el index.html y es React quien
    # resuelve la ruta. Sin esto, recargar en /marcas daría un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html NO se cachea: es el que apunta a los assets nuevos
    # después de cada despliegue.
    #
    # Y es la única respuesta que lleva la política de contenido (CSP):
    # todas las pantallas del panel y de la web son este fichero, y solo
    # en una página hay código que proteger. Va escrita aquí y no en el
    # fichero de cabeceras para no ponérsela a los PDF (los abre el visor
    # del navegador, y alguno se niega con una CSP estricta).
    #
    #   · script-src 'self'   → solo ficheros del sitio: ni un <script>
    #     escrito en la página (por eso el tema va en tema-inicial.js) ni
    #     eval. Es lo que impide que código colado lea la sesión.
    #   · style-src 'unsafe-inline' → HeroUI y las animaciones ponen
    #     estilos en línea. Un estilo no ejecuta código.
    #   · img-src https:      → los logos de las marcas pueden ser una
    #     dirección de cualquier web; data: y blob:, las vistas previas.
    #   · connect-src         → la API, Reverb (wss:// de este dominio) y
    #     Google Fonts, que el service worker descarga para guardarla.
    #   · frame-ancestors 'self' → nadie mete el panel en un marco ajeno.
    #
    # Un recurso nuevo de otro dominio (un vídeo de YouTube, un mapa) no
    # carga hasta que se añade aquí; la consola del navegador lo dice:
    # «Refused to load … because it violates the Content Security Policy».
    location = /index.html {
        include snippets/tsports-seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss://$host https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # ---------------------------------------------------------------
    # 4) La aplicación instalable
    # ---------------------------------------------------------------
    # El service worker TAMPOCO se cachea, y aquí importa más todavía:
    # es el fichero que decide qué versión ve la gente. Si un proxy se
    # queda con el de ayer, el equipo se queda con la aplicación de ayer
    # y no hay forma de sacarlo de ahí desde el servidor.
    #
    # Los navegadores modernos ya lo piden saltándose su caché, pero eso
    # no cubre lo que haya por el camino.
    location = /sw.js {
        include snippets/tsports-seguridad.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # El manifiesto lleva su propio tipo. nginx solo lo conoce desde la
    # 1.21; en versiones anteriores saldría como application/octet-stream
    # y el navegador no ofrecería instalar la aplicación.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # ---------------------------------------------------------------
    # Compresión
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------
    # Ficheros que nunca se sirven
    # ---------------------------------------------------------------
    # Ni los ocultos (.env, .git) ni nada que quede fuera de sitio.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Registros separados por sitio, para poder leerlos.
    access_log /var/log/nginx/tsports-access.log;
    error_log  /var/log/nginx/tsports-error.log;
}
