; =====================================================================
;  TS SPORTS — Límites de subida de PHP
;  ---------------------------------------------------------------------
;  Se instala como /etc/php/<versión>/fpm/conf.d/99-tsports.ini: lo hace
;  instalar-vps.sh la primera vez, y desplegar.sh lo vuelve a copiar
;  cada vez que cambia. Ojo: PHP-FPM es UNO para producción y test, así
;  que este fichero vale para los dos sitios a la vez.
;
;  LOS TRES LÍMITES VAN JUNTOS
;    · Laravel (App\Support\GuardadoDeArchivos): 20 MB por fichero.
;    · PHP (este fichero): 20 MB por fichero y 25 MB por petición, que
;      además del fichero lleva su miniatura y los bordes del formulario.
;    · nginx: client_max_body_size 25M (deploy/nginx.conf).
;  Si se sube solo uno, los otros cortan la petición antes de que
;  Laravel la vea, y el usuario recibe un error sin explicación.
;
;  Antes de este fichero regían los 2 MB de fábrica de Debian: una foto
;  de móvil de 3 MB fallaba al subirla como logo, aunque Laravel dijera
;  que el límite eran 5 MB.
; =====================================================================

upload_max_filesize = 20M
post_max_size = 25M
