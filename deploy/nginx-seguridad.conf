# =====================================================================
#  TS SPORTS — Cabeceras de seguridad de nginx
#  ---------------------------------------------------------------------
#  Las incluye deploy/nginx.conf en el servidor y en CADA location que
#  pone alguna cabecera propia. No es manía: en nginx, un `add_header`
#  dentro de un location anula todos los del servidor, no se suma a
#  ellos. Hasta el 2026-10-01 estaban escritas una sola vez, arriba, y el
#  panel (index.html), /storage, /assets y /sw.js salían sin ninguna: el
#  panel se podía meter en un marco de otra web y los ficheros subidos
#  no llevaban `nosniff`.
#
#  INSTALACIÓN (una vez por máquina; los dos sitios la comparten)
#    sudo cp deploy/nginx-seguridad.conf /etc/nginx/snippets/tsports-seguridad.conf
#    sudo nginx -t && sudo systemctl reload nginx
#
#  La política de contenido (CSP) NO va aquí: solo protege páginas, y va
#  en el location de index.html (ver nginx.conf). Aquí la llevarían
#  también los PDF de la galería y de los adjuntos, y el visor de PDF de
#  algunos navegadores se niega a abrirlos con una CSP estricta.
# =====================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Un año diciendo «este dominio va siempre por HTTPS». Sin subdominios:
# no sabemos si alguno de tsports.tech va a servirse alguna vez sin él.
add_header Strict-Transport-Security "max-age=31536000" always;

# Nada del panel usa la cámara, el micro, la ubicación ni los pagos.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
